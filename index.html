<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>制作人</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    background: #000;
    display: flex;
    align-items: flex-start;
    justify-content: center;
    overflow: hidden;
    user-select: none;
    cursor: crosshair;
  }
  /* 16:9 画布：最大化居中；开场推镜用 */
  #canvas16x9 {
    position: relative;
    width: min(100vw, calc(68vh * 16 / 9));      /* 电脑端画布档位 */
    aspect-ratio: 16 / 9;
    background: transparent;
    overflow: hidden;
    margin-top: max(12vh, calc((100vh - min(100vw * 9 / 16, 68vh)) * 0.65));
    transform-origin: 49.42% 61.33%;             /* 视频中心x/底缘y：推镜终点=方形贴底70%视口高 */
    transition: transform 0.95s cubic-bezier(.32, 0, .18, 1);
  }
  #canvas16x9.zoomed { transform: translate(var(--zoom-dx, 0px), var(--zoom-dy, 0px)) scale(var(--zoom-k, 1)); }
  /* 手机竖屏：画布宽满屏、顶在 42% 屏高；推镜行为与电脑一致 */
  @media (orientation: portrait) {
    #canvas16x9 {
      width: 100vw;
      margin-top: 42vh;
      margin-top: 42dvh;
    }
  }
  #base {
    position: absolute; inset: 0;
    width: 100%; height: 100%;
    object-fit: contain;
    display: block;
  }
  /* 半身素材（电脑/安卓=四段 WebM 视频；iOS=四段动画 WebP 循环）共用定位：与底图人物对齐 */
  #canvas16x9 video, #canvas16x9 .half {
    position: absolute;
    left: 35.38%;          /* 人物中心 x 对齐 */
    top: 11.39%;           /* 肩线对齐 */
    width: 28.09%;         /* 人物宽度对齐 */
    aspect-ratio: 1 / 1;
    height: auto;
    opacity: 0;
    transition: none;      /* 硬切，杜绝闪烁 */
    pointer-events: none;
    display: block;
  }
  #canvas16x9 video.on, #canvas16x9 .half.on { opacity: 1; }
  /* 环形光标（暗底用亮色） */
  #ring {
    position: fixed; z-index: 9; pointer-events: none;
    width: 30px; height: 30px; margin: -15px 0 0 -15px;
    border: 1.5px solid rgba(255, 255, 255, .75);
    border-radius: 50%;
    transition: transform .05s ease-out;
  }
  #ring::after {
    content: ""; position: absolute; left: 50%; top: 50%;
    width: 3px; height: 3px; margin: -1.5px 0 0 -1.5px;
    background: rgba(255, 255, 255, .9); border-radius: 50%;
  }
  /* 背景测试色板（顶部居中悬浮） */
  #bgsw {
    position: fixed; top: 12px; left: 50%; transform: translateX(-50%);
    z-index: 99; display: flex; gap: 12px;
    padding: 9px 14px; background: rgba(128, 128, 128, .35); border-radius: 22px;
    backdrop-filter: blur(4px);
  }
  #bgsw button {
    width: 22px; height: 22px; border-radius: 50%;
    border: 1.5px solid rgba(255, 255, 255, .6); cursor: pointer; padding: 0;
  }
  #bgsw button.sel { outline: 2px solid #ffd54f; outline-offset: 2px; }
</style>

    <img class="half" id="w-up" alt="">
    <img class="half" id="w-down" alt="">
    <img class="half" id="w-left" alt="">
    <img class="half" id="w-right" alt="">
    <video id="v-up"    muted playsinline preload="auto"></video>
    <video id="v-down"  muted playsinline preload="auto"></video>
    <video id="v-left"  muted playsinline preload="auto"></video>
    <video id="v-right" muted playsinline preload="auto"></video>
  </div>
  <div id="ring"></div>
  <!-- 背景测试色板：默认黑，点击切换 -->
  <div id="bgsw">
    <button data-bg="#000000" class="sel" style="background:#000" aria-label="黑"></button>
    <button data-bg="#ffffff" style="background:#fff" aria-label="白"></button>
    <button data-bg="#e53935" style="background:#e53935" aria-label="红"></button>
    <button data-bg="#00c853" style="background:#00c853" aria-label="绿"></button>
  </div>

<script>
/* ============ 终端分流：一族只加载自己需要的东西 ============ */
/* 电脑/安卓（真支持 WebM VP9 alpha）→ 四段视频 + 转头跟随
   其余（iOS 全系 + 桌面 Safari）→ 四段动画 WebP（播一次定帧）
   关键：Safari 能播 WebM 但不渲染 alpha 通道（黑底），canPlayType 会谎报——UA 排除之 */
const isSafariUA = /^((?!chrome|android|crios|fxios|edgi).)*safari/i.test(navigator.userAgent);
const WEBM_OK = !!document.createElement("video").canPlayType('video/webm; codecs="vp9"') && !isSafariUA;
const base = document.getElementById("base");
const canvasEl = document.getElementById("canvas16x9");

let zoomDone = false;     /* 推镜动画结束 */
let halfReady = false;    /* 半身素材首帧已真实渲染（图片 onload / 视频 rqvfc） */
let current = null;       /* 当前显示方向（null=底图态） */
let targetT = 0;
let switching = false;
let followEnabled = false;
const vids = {};
const wimgs = {};

if (WEBM_OK) {
  for (const k of ["up", "down", "left", "right"]) {
    const v = document.getElementById("v-" + k);
    v.src = "assets/" + k + ".webm";
    v.load();
    vids[k] = v;
    /* 预解码首帧，杜绝首次切换闪烁 */
    v.addEventListener("loadeddata", () => { v.currentTime = 0; }, { once: true });
  }
  /* 首帧真的画到屏上才算就绪（rqvfc 比 readyState 严格；loadeddata 兜底老浏览器） */
  vids.up.addEventListener("requestVideoFrameCallback", () => { halfReady = true; trySwap(); }, { once: true });
  vids.up.addEventListener("loadeddata", () => { halfReady = true; trySwap(); }, { once: true });
} else {
  /* iOS：动画 WebP 播一次定帧。先全部预下载进缓存（不赋给显示元素），
     首次指向某方向时才赋 src 开始播——播完定格，不循环 */
  const preCache = {};
  let preloaded = 0;
  for (const k of ["up", "down", "left", "right"]) {
    wimgs[k] = document.getElementById("w-" + k);
    const pre = new Image();
    preCache[k] = pre;
    pre.onload = () => { if (++preloaded === 4) { halfReady = true; trySwap(); } };
    pre.src = "assets/" + k + "-ios.webp";
  }
}

/* 切换：推镜结束 且 半身已渲染，两个条件都齐才切；永不强切 */
function trySwap() {
  if (current !== null || !zoomDone || !halfReady) return;
  base.style.visibility = "hidden";
  let halfEl;
  if (WEBM_OK) halfEl = vids.up;
  else { halfEl = wimgs.up; halfEl.src = "assets/up-ios.webp"; } /* 此刻才开播 up，播完定帧 */
  halfEl.classList.add("on");
  current = "up";
  followEnabled = true;
}

/* 开场推镜（横竖屏同一套）：进场只看全身 → 推到方形贴底70%视口高 → 换半身 */
setTimeout(() => {
  const r = canvasEl.getBoundingClientRect();
  /* 方形视频：高占画布 49.94%（=28.09%×16/9），底缘 61.33%，中心 x 49.42% */
  const portrait = window.matchMedia("(orientation: portrait)").matches;
  const k  = window.innerHeight / (r.height * 0.4994) * (portrait ? 0.441 : 0.7);
  const dy = window.innerHeight - (r.top + r.height * 0.6133);
  const dx = window.innerWidth / 2 - (r.left + r.width * 0.4942);
  canvasEl.style.setProperty("--zoom-k",  k.toFixed(4));
  canvasEl.style.setProperty("--zoom-dy", dy.toFixed(1) + "px");
  canvasEl.style.setProperty("--zoom-dx", dx.toFixed(1) + "px");
  canvasEl.classList.add("zoomed");
}, 1100);
canvasEl.addEventListener("transitionend", (e) => {
  if (e.propertyName === "transform" && canvasEl.classList.contains("zoomed")) { zoomDone = true; trySwap(); }
}, { once: true });
setTimeout(() => { zoomDone = true; trySwap(); }, 2300); /* transitionend 不发的环境兜底；trySwap 幂等 */

const DEAD = 0.09;        // 中心死区（正脸）

function switchDir(dir) {
  if (dir === current || switching) return;
  const newEl = WEBM_OK ? vids[dir] : wimgs[dir];
  const oldEl = WEBM_OK ? vids[current] : wimgs[current];
  if (!oldEl) { current = dir; newEl.classList.add("on"); return; }
  if (!WEBM_OK) {
    /* iOS 动画 WebP：首次指向才开播（预载已完成，赋 src 即播）；播过则保持定格显隐切换 */
    if (!newEl.src) newEl.src = "assets/" + dir + "-ios.webp";
    newEl.classList.add("on");
    oldEl.classList.remove("on");
    current = dir;
    return;
  }
  /* WebM：同比例位置接管（seek 对齐防跳变） */
  const ratio = oldEl.duration ? oldEl.currentTime / oldEl.duration : 0;
  const target = Math.min(ratio * (newEl.duration || 3), (newEl.duration || 3) - 0.05);
  switching = true;
  newEl.currentTime = target;
  const doSwitch = () => {
    newEl.classList.add("on");
    oldEl.classList.remove("on");
    current = dir;
    switching = false;
  };
  if (newEl.seeking || newEl.readyState < 2) {
    newEl.addEventListener("seeked", () => requestAnimationFrame(doSwitch), { once: true });
    setTimeout(() => { if (switching) doSwitch(); }, 120);
  } else {
    requestAnimationFrame(doSwitch);
  }
}

const ring = document.getElementById("ring");

/* 方向判定（两端共用）：x,y 相对当前半身素材屏幕框的归一化偏移 */
function judge(x, y) {
  const v = WEBM_OK ? (vids[current] || vids.up) : (wimgs[current] || wimgs.up);
  if (!v) return;
  const c = v.getBoundingClientRect();
  if (!c.width) return;
  const cx = c.left + c.width / 2, cy = c.top + c.height / 2;
  const dx = (x - cx) / (c.width / 2);
  const dy = (y - cy) / (c.height / 2);
  const mag = Math.min(Math.hypot(dx, dy), 1);

  if (mag < DEAD) { targetT = 0; return; }

  let dir;
  if (Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? "right" : "left";
  else                             dir = dy > 0 ? "down"  : "up";

  switchDir(dir);
  targetT = mag * 3;   /* 幅度仅 WebM 有意义（tick 会按真实时长 clamp） */
}

function onMove(e) {
  ring.style.left = e.clientX + "px";
  ring.style.top  = e.clientY + "px";
  if (!followEnabled) return;
  judge(e.clientX, e.clientY);
}
window.addEventListener("mousemove", onMove, { passive: true });

/* 手机触摸：手指按下/滑动 → 同一套方向判定；touchmove 拦掉防 iOS 橡皮筋 */
function onTouch(e) {
  const t = e.touches[0];
  if (!t) return;
  ring.style.left = t.clientX + "px";
  ring.style.top  = t.clientY + "px";
  if (!followEnabled) return;
  judge(t.clientX, t.clientY);
}
window.addEventListener("touchstart", onTouch, { passive: true });
window.addEventListener("touchmove", (e) => { e.preventDefault(); onTouch(e); }, { passive: false });

/* 背景测试色板：点击换 body 背景 */
document.querySelectorAll("#bgsw button").forEach((b) => {
  b.addEventListener("click", () => {
    document.body.style.background = b.dataset.bg;
    document.querySelectorAll("#bgsw button").forEach((x) => x.classList.remove("sel"));
    b.classList.add("sel");
  });
});

/* rAF 扫描：currentTime 平滑追赶目标（不播放，纯扫描） */
(function tick() {
  if (current && WEBM_OK && !switching) {
    const v = vids[current];
    const d = v.duration || 3;
    const t = Math.min(targetT, d - 0.001);
    if (!v.seeking && Math.abs(v.currentTime - t) > 0.008) {
      v.currentTime += (t - v.currentTime) * 0.12;
      if (Math.abs(v.currentTime - t) < 0.01) v.currentTime = t;
    }
  }
  requestAnimationFrame(tick);
})();
</script>
