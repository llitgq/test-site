<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>星空点阵手-实验</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; background: #000; overflow: hidden; }
  #sky { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; }
  #dbg { position: fixed; left: 8px; bottom: 8px; z-index: 9; color: #6f7; font: 11px monospace; opacity: .7; }
</style>
</head>
<body>
<canvas id="sky"></canvas>
<div id="dbg"></div>
<script>
/* ================= 星空 + 点阵手（纯程序生成，零外部素材） ================= */
const sky = document.getElementById("sky");
const ctx = sky.getContext("2d");
let SW = 0, SH = 0, DPR = 1;

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  SW = window.innerWidth; SH = window.innerHeight;
  sky.width = SW * DPR; sky.height = SH * DPR;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initStars();
}

/* ---------- 星空 ---------- */
let stars = [], meteors = [], nextMeteor = 0;
function initStars() {
  const n = Math.round(SW * SH / 4200);
  stars = [];
  for (let i = 0; i < n; i++) {
    const layer = Math.random();
    stars.push({
      x: Math.random() * SW, y: Math.random() * SH,
      r: 0.4 + layer * 1.3,
      a: 0.25 + Math.random() * 0.55,
      ph: Math.random() * Math.PI * 2,
      tw: 0.4 + Math.random() * 1.6,
      dx: 0.6 + layer * 2.4,
      hue: Math.random() < 0.12 ? (Math.random() < 0.5 ? "#ffd9b0" : "#bcd0ff") : "#ffffff"
    });
  }
  meteors = []; nextMeteor = 4 + Math.random() * 6;
}

function drawSky(t, dt) {
  const g = ctx.createLinearGradient(0, 0, 0, SH);
  g.addColorStop(0, "#04060f"); g.addColorStop(0.55, "#02030a"); g.addColorStop(1, "#000000");
  ctx.fillStyle = g; ctx.fillRect(0, 0, SW, SH);
  for (const s of stars) {
    s.x += s.dx * dt; if (s.x > SW + 4) s.x = -4;
    const a = s.a * (0.62 + 0.38 * Math.sin(t * s.tw + s.ph));
    ctx.globalAlpha = Math.max(0, a);
    ctx.fillStyle = s.hue;
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
    if (s.r > 1.2) {
      ctx.globalAlpha = a * 0.35;
      ctx.fillRect(s.x - s.r * 3, s.y - 0.4, s.r * 6, 0.8);
      ctx.fillRect(s.x - 0.4, s.y - s.r * 3, 0.8, s.r * 6);
    }
  }
  if (t > nextMeteor) {
    meteors.push({ x: Math.random() * SW * 0.7, y: Math.random() * SH * 0.5, vx: 520 + Math.random() * 300, vy: 160 + Math.random() * 120, life: 0.9 });
    nextMeteor = t + 6 + Math.random() * 9;
  }
  for (let i = meteors.length - 1; i >= 0; i--) {
    const m = meteors[i]; m.life -= dt; m.x += m.vx * dt; m.y += m.vy * dt;
    if (m.life <= 0) { meteors.splice(i, 1); continue; }
    const fade = Math.min(1, m.life / 0.9);
    const mg = ctx.createLinearGradient(m.x, m.y, m.x - m.vx * 0.14, m.y - m.vy * 0.14);
    mg.addColorStop(0, "rgba(255,255,255," + (0.9 * fade).toFixed(3) + ")");
    mg.addColorStop(1, "rgba(255,255,255,0)");
    ctx.globalAlpha = 1; ctx.strokeStyle = mg; ctx.lineWidth = 1.6;
    ctx.beginPath(); ctx.moveTo(m.x, m.y); ctx.lineTo(m.x - m.vx * 0.14, m.y - m.vy * 0.14); ctx.stroke();
  }
  ctx.globalAlpha = 1;
}

/* ---------- 手形：Material Symbols touch_app 图标（Apache 2.0）运行时点阵化 ----------
   光栅化 → 连通域去波纹 → 网格采样 → 边缘标记。素材失败则手动画不启用，星空照常。 */
const HAND_SVG = '<svg xmlns="http://www.w3.org/2000/svg" height="48" viewBox="0 -960 960 960" width="48"><path fill="#000" d="M445-80q-29 0-56-12t-45-35L127-403l21-23q14-15 34.5-18.5T221-438l99 53v-365q0-12.75 8.68-21.38 8.67-8.62 21.5-8.62 12.82 0 21.32 8.62 8.5 8.63 8.5 21.38v465l-144-77 156 198q10 12 23.76 18 13.76 6 29.24 6h205q38 0 64-26t26-64v-170q0-25.5-17.25-42.75T680-460H460v-60h219.65q50.14 0 85.25 35 35.1 35 35.1 85v170q0 63-43.5 106.5T650-80H445ZM203-665q-11.07-18.75-17.04-40.49-5.96-21.74-5.96-44.76 0-70.75 49.5-120.25T350-920q71 0 120.5 49.74t49.5 120.3q0 22.96-5.96 44.62Q508.07-683.68 497-665l-52-30q7-12 11-26t4-29.48Q460-796 427.88-828q-32.12-32-78-32T272-827.92q-32 32.09-32 77.92 0 15 4 29t11 26l-52 30Zm285 335Z"/></svg>';

let DOTS = null, TIP_NX = 0.9, TIP_NY = 0.5;

async function buildDotsFromSVG() {
  const S = 480;
  const blob = new Blob([HAND_SVG], { type: "image/svg+xml" });
  const url = URL.createObjectURL(blob);
  const img = new Image();
  await new Promise((ok, no) => { img.onload = ok; img.onerror = no; img.src = url; });
  const c = document.createElement("canvas"); c.width = S; c.height = S;
  const g = c.getContext("2d", { willReadFrequently: true });
  /* 旋转 90° 顺时针：食指朝右（左手形，从左伸入）；右手在渲染时镜像 */
  g.translate(S / 2, S / 2); g.rotate(Math.PI / 2); g.drawImage(img, -S / 2, -S / 2, S, S);
  const px = g.getImageData(0, 0, S, S).data;
  const solid = (x, y) => x >= 0 && y >= 0 && x < S && y < S && px[(y * S + x) * 4 + 3] > 100;
  /* 连通域：只保留最大块（去掉波纹弧等孤立件） */
  const seen = new Uint8Array(S * S);
  let best = null;
  for (let sy = 0; sy < S; sy += 4) for (let sx = 0; sx < S; sx += 4) {
    const idx = sy * S + sx;
    if (seen[idx] || !solid(sx, sy)) continue;
    const comp = [idx]; const q = [idx]; seen[idx] = 1;
    while (q.length) {
      const i = q.pop(); const x = i % S, y = (i / S) | 0;
      for (const [nx2, ny2] of [[x+2,y],[x-2,y],[x,y+2],[x,y-2]]) {
        if (nx2 < 0 || ny2 < 0 || nx2 >= S || ny2 >= S) continue;
        const j = ny2 * S + nx2;
        if (!seen[j] && solid(nx2, ny2)) { seen[j] = 1; comp.push(j); q.push(j); }
      }
    }
    if (!best || comp.length > best.length) best = comp;
  }
  const inMain = new Set(best);
  const dots = [], step = 6;
  for (let y = 0; y < S; y += step)
    for (let x = 0; x < S; x += step) {
      if (!inMain.has(y * S + x)) continue;
      const edge = !solid(x - step, y) || !solid(x + step, y) || !solid(x, y - step) || !solid(x, y + step);
      dots.push([x / S, y / S, edge ? 1 : 0]);
    }
  URL.revokeObjectURL(url);
  /* 指尖锚：nx 的 97 百分位；指尖高度=该处点的 ny 中位 */
  const xs = dots.map(d => d[0]).sort((a, b) => a - b);
  TIP_NX = xs[Math.floor(xs.length * 0.97)];
  const tipYs = dots.filter(d => d[0] >= TIP_NX - 0.02).map(d => d[1]).sort((a, b) => a - b);
  TIP_NY = tipYs[Math.floor(tipYs.length / 2)] || 0.5;
  return dots;
}

/* ---------- 点阵手实例 ---------- */
/* style: "dot" 圆点 | "binary" 0/1 字符 | "glyph" ·+ 字符 */
function makeHand(type, fromLeft) {
  return {
    type, fromLeft,
    dots: DOTS.map(d => ({ nx: d[0], ny: d[1], edge: d[2],
      delay: Math.random() * 0.55,
      sx: Math.random() * 2 - 1, sy: Math.random() * 2 - 1,   /* 散开偏移(相对屏) */
      bit: Math.random() < 0.5 ? "0" : "1",
      ph: Math.random() * Math.PI * 2 }))
  };
}

/* ---------- 编排 ---------- */
/* 阶段: idle(2.0) → in(1.8 两手聚合滑入) → touch(1.4 电花) → out(1.2 弹开散开) → idle 换风格 */
const STYLES = [["dot", "dot"], ["binary", "binary"], ["dot", "binary"], ["glyph", "glyph"]];
let styleIdx = 0, handL = null, handR = null;
let stage = "idle", stageT = 0;
const DUR = { idle: 2.0, in: 1.8, touch: 1.4, out: 1.2 };

function newPair() {
  const [sl, sr] = STYLES[styleIdx % STYLES.length]; styleIdx++;
  handL = makeHand("human", true);  handL.style = sl;
  handR = makeHand("human", false); handR.style = sr;   /* 形同,风格区分;robot 形后续换 */
  stage = "in"; stageT = 0;
}

/* 手的目标几何:手高=SH*0.26;以食指尖为锚贴中线,右手水平镜像;TIP_NX/TIP_NY 由采样管线计算 */
const touchY = () => 0.46 + (TIP_NY - 0.5) * 0.26;   /* 指尖在屏幕上的相对高度 */
function handGeom(fromLeft) {
  const h = SH * 0.26, w = h * (640 / 360);
  const cy = SH * 0.46;
  const tipGap = SW * 0.006;
  /* fromLeft:指尖在框内 TIP_NX 处,让指尖落在中线-gap;fromRight 镜像后指尖在框内 (1-TIP_NX) 处 */
  const x0 = fromLeft ? SW / 2 - tipGap - TIP_NX * w
                      : SW / 2 + tipGap - (1 - TIP_NX) * w;
  return { x: x0, y: cy - h / 2, w, h };
}

const easeOutCubic = u => 1 - Math.pow(1 - u, 3);
const easeOutBack  = u => { const c = 1.70158; return 1 + (c + 1) * Math.pow(u - 1, 3) + c * Math.pow(u - 1, 2); };

/* sparks: 触碰电花 */
let sparks = [];
function emitSparks(x, y, n) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = 40 + Math.random() * 240;
    sparks.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v - 40, life: 0.5 + Math.random() * 0.7, r: 0.8 + Math.random() * 1.6 });
  }
}

function drawHand(hand, t, dt) {
  const g = handGeom(hand.fromLeft);
  /* 聚合进度:仅 in 阶段推进;touch/out 保持完成态 */
  const prog = stage === "in" ? Math.min(1, stageT / DUR.in) : 1;
  /* 滑入位移:从屏外 lerp 到位 */
  const slide = hand.fromLeft ? (1 - easeOutCubic(prog)) * -(g.w * 1.15) : (1 - easeOutCubic(prog)) * (g.w * 1.15);
  /* out 阶段:先过冲回弹再退场 */
  let outOff = 0, scatter = 0;
  if (stage === "out") {
    const p = Math.min(1, stageT / DUR.out);
    const back = p < 0.4 ? (1 - easeOutBack(p / 0.4)) * SH * 0.045 : 0;   /* 回弹内压 */
    const leave = p < 0.4 ? 0 : easeOutCubic((p - 0.4) / 0.6);
    outOff = (hand.fromLeft ? -1 : 1) * (leave * g.w * 1.3) + (hand.fromLeft ? -1 : 1) * back;
    scatter = leave;
  }
  const touchPct = stage === "touch" ? Math.min(1, stageT / 0.35) : 0;
  const px = g.x + slide + outOff;

  ctx.save();
  for (const d of hand.dots) {
    /* 聚合:每点延迟从散位飞向目标;右手水平镜像 */
    const lp = Math.max(0, Math.min(1, (prog - d.delay * 0.5) / 0.5));
    const e = easeOutCubic(lp);
    const nx = hand.fromLeft ? d.nx : 1 - d.nx;
    let x = g.x + nx * g.w + slide + outOff;
    let y = g.y + d.ny * g.h;
    x += (1 - e) * d.sx * SW * 0.35;
    y += (1 - e) * d.sy * SH * 0.35;
    if (scatter > 0) { x += d.sx * scatter * SW * 0.5; y += d.sy * scatter * SH * 0.5; }
    /* touch:指尖列向中线再压 6px,按压感(镜像下指尖在右,压向左) */
    const tipness = hand.fromLeft ? (1 - nx) : nx;    /* 越接近指尖侧越大 */
    if (touchPct > 0 && tipness > 0.86) x += (hand.fromLeft ? 1 : -1) * touchPct * SH * 0.012;

    const alpha = e;
    if (alpha <= 0.02) continue;
    const tw = 0.75 + 0.25 * Math.sin(t * 2.2 + d.ph);

    if (hand.style === "binary") {
      /* 0/1 数字点阵:边缘点更亮 */
      ctx.globalAlpha = alpha * (d.edge ? 0.95 : 0.5) * tw;
      ctx.fillStyle = d.edge ? "#cfe8ff" : "#5f86b8";
      ctx.font = (d.edge ? 9 : 8) + "px monospace";
      ctx.fillText(d.bit, x, y);
      /* 偶尔翻滚 bit */
      if (Math.random() < 0.003) d.bit = Math.random() < 0.5 ? "0" : "1";
    } else if (hand.style === "glyph") {
      ctx.globalAlpha = alpha * (d.edge ? 0.95 : 0.45) * tw;
      ctx.fillStyle = d.edge ? "#ffe9c4" : "#8a7440";
      ctx.font = (d.edge ? 12 : 9) + "px monospace";
      ctx.fillText(d.edge ? "✦" : "·", x, y);
    } else {
      /* dot 圆点 */
      const r = d.edge ? 2.1 : 1.3;
      ctx.globalAlpha = alpha * (d.edge ? 0.95 : 0.55) * tw;
      ctx.fillStyle = d.edge ? "#eaf4ff" : "#6d90b9";
      ctx.beginPath(); ctx.arc(x, y, r, 0, 6.2832); ctx.fill();
    }
  }
  ctx.restore();
}

function drawTouchFx(t, dt) {
  /* 触碰点:中线上光晕脉冲 + 电花 */
  if (stage !== "touch" && sparks.length === 0) return;
  const cx = SW / 2, cy = SH * touchY();
  if (stage === "touch") {
    const p = Math.min(1, stageT / DUR.touch);
    const pulse = 0.5 + 0.5 * Math.sin(t * 9);
    const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, 60 + pulse * 26);
    rg.addColorStop(0, "rgba(255,240,200," + (0.5 * (1 - p * 0.4)).toFixed(3) + ")");
    rg.addColorStop(1, "rgba(255,240,200,0)");
    ctx.fillStyle = rg;
    ctx.beginPath(); ctx.arc(cx, cy, 60 + pulse * 26, 0, 6.2832); ctx.fill();
    if (Math.random() < 0.55) emitSparks(cx, cy, 2);
  }
  ctx.save();
  for (let i = sparks.length - 1; i >= 0; i--) {
    const s = sparks[i]; s.life -= dt; s.x += s.vx * dt; s.y += s.vy * dt; s.vy += 160 * dt;
    if (s.life <= 0) { sparks.splice(i, 1); continue; }
    ctx.globalAlpha = Math.min(1, s.life / 0.6);
    ctx.fillStyle = "#ffe9b8";
    ctx.beginPath(); ctx.arc(s.x, s.y, s.r, 0, 6.2832); ctx.fill();
  }
  ctx.restore();
  ctx.globalAlpha = 1;
}

/* ---------- 主循环 ---------- */
let last = 0, dbgEl = document.getElementById("dbg");
function frame(ms) {
  const t = ms / 1000;
  const dt = Math.min(0.05, t - last || 0.016); last = t;
  drawSky(t, dt);
  if (stage === "idle") {
    stageT += dt;
    if (stageT >= DUR.idle) { newPair(); }
  } else {
    stageT += dt;
    drawHand(handL, t, dt);
    drawHand(handR, t, dt);
    drawTouchFx(t, dt);
    if (stageT >= DUR[stage]) {
      if (stage === "out") { stage = "idle"; stageT = 0; handL = handR = null; sparks = []; }
      else { stage = stage === "in" ? "touch" : "out"; stageT = 0; if (stage === "touch") emitSparks(SW / 2, SH * touchY(), 24); }
    }
  }
  if (dbgEl) dbgEl.textContent = "stage=" + stage + " t=" + stageT.toFixed(2) + " dots=" + DOTS.length + " sparks=" + sparks.length;
  requestAnimationFrame(frame);
}

window.addEventListener("resize", resize);
resize();
/* 手形素材就绪才启用手动画；失败=只留星空，不露破绽 */
buildDotsFromSVG().then(dots => {
  DOTS = dots;
  newPair();
  stage = "idle"; stageT = DUR.idle;
  /* 调试快进:?jump=touch / jump=in2 / jump=out —— 直接定格到指定阶段中段 */
  const jump = new URLSearchParams(location.search).get("jump");
  if (jump) {
    newPair();
    if (jump === "in2")   { stage = "in";    stageT = DUR.in - 0.01; }
    if (jump === "touch") { stage = "touch"; stageT = 0.5; emitSparks(SW / 2, SH * touchY(), 24); }
    if (jump === "out")   { stage = "out";   stageT = 0.5; }
  }
}).catch(() => { if (dbgEl) dbgEl.textContent = "hand asset failed"; });
requestAnimationFrame(frame);
</script>
</body>
</html>
